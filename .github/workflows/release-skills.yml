name: Package Skills Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Validate all Skills
        run: bash tests/run_tests.sh

      - name: Build Skill distribution archive
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          root = Path("skills")
          output = Path("galact-skills.zip")
          with ZipFile(output, "w", ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob("*")):
                  if not path.is_file():
                      continue
                  relative = path.relative_to(root)
                  if "__pycache__" in relative.parts:
                      continue
                  if any(part in {"recon", "report"} for part in relative.parts):
                      continue
                  if "evidence" in relative.parts and path.name != ".gitkeep":
                      continue
                  archive.write(path, (root / relative).as_posix())
          print(f"Created {output} ({output.stat().st_size} bytes)")
          PY

      - name: Check release notes
        run: test -s release_note.md

      - name: Create GitHub Release and upload archive
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_note.md
          files: galact-skills.zip
          generate_release_notes: false
